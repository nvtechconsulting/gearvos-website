<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GearvOS — Only the Tools You Need</title>
<meta name="description" content="GearvOS is modular business software for SMEs. Pick only the modules you need, hosted on your own domain, never locked in. Coming soon." />

<meta property="og:title" content="GearvOS — Only the Tools You Need" />
<meta property="og:description" content="Modular business software for SMEs. Coming soon." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://gearvos.com" />

<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --orange:#D9662B;
    --ink:#1A1A1A;
    --muted:#757575;
    --line:#e9e5e1;
    --bg:#fbfaf9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:56px 24px 40px;
  }

  .lockup{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:44px;
  }
  .lockup .icon{width:52px;height:52px;flex-shrink:0;}
  .lockup .icon svg{width:100%;height:100%;display:block;}
  .lockup .name-block{display:flex;flex-direction:column;align-items:flex-start;}
  .lockup .wordmark{
    font-weight:800;font-size:30px;line-height:1;white-space:nowrap;
  }
  .lockup .gearv{color:var(--orange);}
  .lockup .os{color:var(--ink);}
  .lockup .tagline{
    font-weight:600;font-size:9.5px;letter-spacing:1.6px;color:var(--muted);
    white-space:nowrap;margin-top:5px;
  }

  .status{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--orange);color:var(--orange);
    font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;
    padding:6px 14px;border-radius:20px;margin-bottom:26px;
  }
  .status::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);
  }

  h1{
    font-weight:800;font-size:clamp(26px,4.4vw,42px);line-height:1.25;
    margin:0 0 18px;max-width:680px;letter-spacing:-0.3px;
  }
  .sub{
    font-weight:500;font-size:clamp(15px,2vw,17px);line-height:1.6;color:#4a4a4a;
    max-width:520px;margin:0 0 36px;
  }

  .cta{
    display:inline-block;background:var(--orange);color:#fff;
    font-weight:700;font-size:15px;text-decoration:none;
    padding:14px 30px;border-radius:9px;
  }

  footer{
    text-align:center;padding:22px 24px 28px;border-top:1px solid var(--line);
  }
  footer p{
    margin:0;font-weight:400;font-size:13px;color:var(--muted);
  }
  footer a{color:var(--muted);text-decoration:underline;}
  footer a:hover{color:var(--ink);}
</style>
</head>
<body>

<main>
  <div class="lockup">
    <div class="icon">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M 172.00 100.00 L 190.23 117.95 L 176.50 151.11 L 150.91 150.91 L 150.91 150.91 L 151.11 176.50 L 117.95 190.23 L 100.00 172.00 L 100.00 172.00 L 82.05 190.23 L 48.89 176.50 L 49.09 150.91 L 49.09 150.91 L 23.50 151.11 L 9.77 117.95 L 28.00 100.00 L 28.00 100.00 L 9.77 82.05 L 23.50 48.89 L 49.09 49.09 L 49.09 49.09 L 48.89 23.50 L 82.05 9.77 L 100.00 28.00 L 100.00 28.00 L 117.95 9.77 L 151.11 23.50 L 150.91 49.09 L 150.91 49.09 L 176.50 48.89 L 190.23 82.05 L 172.00 100.00 Z" fill="#D9662B"/>
        <circle cx="100" cy="100" r="70" fill="#D9662B"/>
        <circle cx="100" cy="100" r="62" fill="#ffffff"/>
        <circle cx="100" cy="100" r="50" fill="none" stroke="#1A1A1A" stroke-width="14"/>
        <path d="M 100.00 57.00 L 100.00 68.00 A 16.00 16.00 0 0 0 100.00 100.00 A 16.00 16.00 0 0 1 100.00 132.00 L 100.00 143.00" fill="none" stroke="#1A1A1A" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="100.00" cy="57.00" r="9.86" fill="#1A1A1A"/><circle cx="100.00" cy="143.00" r="9.86" fill="#1A1A1A"/>
      </svg>
    </div>
    <div class="name-block">
      <div class="wordmark"><span class="gearv">Gearv</span><span class="os">OS</span></div>
      <div class="tagline">ONLY THE TOOLS YOU NEED</div>
    </div>
  </div>

  <span class="status">Coming soon</span>

  <h1>Modular business software, built for SMEs.</h1>
  <p class="sub">Pick only the modules you need — customers, tasks, operations — hosted on your own domain. No bloated packages, no lock-in.</p>

  <a class="cta" href="https://nvtechconsulting.com/#contact">Get in Touch</a>
</main>

<footer>
  <p>A product by <a href="https://nvtechconsulting.com">NVTech Consulting</a> · &copy; 2026</p>
</footer>

</body>
</html>
